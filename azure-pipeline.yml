trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:

  # Select Java 17
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: 'Configure Java 17'

  # Explicitly configure Java environment
  - script: |
      export JAVA_HOME="$(JAVA_HOME_17_X64)"
      export PATH="$JAVA_HOME/bin:$PATH"

      echo "JAVA_HOME=$JAVA_HOME"

      java -version
      javac -version
      mvn -version

      echo "Checking compiler location:"
      which javac
    displayName: 'Verify Java 17 Compiler'

  # Build application using Java 17
  - script: |
      export JAVA_HOME="$(JAVA_HOME_17_X64)"
      export PATH="$JAVA_HOME/bin:$PATH"

      mvn clean package
    displayName: 'Maven Build'

  # Publish JAR
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/target'
      artifact: 'StudentGrade-JAR'
      publishLocation: 'pipeline'
    displayName: 'Publish JAR Artifact'